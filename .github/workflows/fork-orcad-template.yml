name: Fork orcad template

# decrypted/orca only, called by fork-build.yml. Builds every orcad slot on its own GitHub-hosted runner
# with the slot steps of upstream's node-server-tests.yml (build, --require-slots, --smoke; no test
# suites) and merges them like its desktop_template job. Upstream's qualified-orcad-template.yml can't
# serve here: its change-scope job skips every lane on a branch push that touches no server paths.
on:
  workflow_call:
    inputs:
      mac_runner:
        description: Runner for the darwin-arm64 slot; an Intel one cross-builds it
        type: string
        default: macos-15-intel

permissions:
  contents: read

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  # Server glibc slots are built on glibc 2.28 with gcc-toolset (static libstdc++), as upstream's floor lane.
  glibc:
    name: linux-${{ matrix.arch }}-glibc
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
          - os: ubuntu-24.04-arm
            arch: arm64
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:c22ffd129ac99a8a42d1f2c2f4e88a9089288dd9ee987a7092da1c7dc48f27a9
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    timeout-minutes: 25
    env:
      CC: gcc
      CXX: g++
      PYTHON: /opt/python/cp312-cp312/bin/python3
    steps:
      - name: Install glibc 2.28 prerequisites
        run: |
          missing_tool=false
          for tool in git ps unzip which xz; do
            command -v "$tool" >/dev/null 2>&1 || missing_tool=true
          done
          if [ "$missing_tool" = true ]; then
            dnf --disablerepo='epel*' install -y git procps-ng unzip which xz
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/install-node-dependencies
        with:
          cache-pnpm-store: 'false'
      - name: Build and smoke the slot under the pinned Node
        run: |
          pnpm build:orcad-prebuilds
          pnpm build:orcad-prebuilds --require-slots "$(node config/scripts/orcad-distribution/prebuilds/build-orcad-prebuilds.mjs --print-slot)"
          pnpm build:orcad-prebuilds --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orcad-prebuild-glibc-${{ matrix.arch }}
          path: out/orcad-prebuilds/
          if-no-files-found: error
          retention-days: 3

  # The opt-in linux-x64-glibc217 slot beside the unofficial glibc-217 Node; the host fetches that Node,
  # the glibc 2.17 image only builds and smokes with it.
  glibc217:
    name: linux-x64-glibc217
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          cache-pnpm-store: 'false'
      - name: Build and smoke the glibc 2.17 compat slot under the glibc-217 Node
        run: |
          compat_node="$(node config/scripts/orcad-distribution/prebuilds/build-orcad-prebuilds.mjs --slot=linux-x64-glibc217 --print-runtime)"
          case "$compat_node" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) echo "glibc-217 Node cached outside the workspace: $compat_node" >&2; exit 1 ;;
          esac
          docker run --rm --init -i \
            -e ORCA_BACKGROUND_LAUNCH=1 \
            -e COMPAT_NODE="/work/${compat_node#"$GITHUB_WORKSPACE"/}" \
            -e CC=gcc -e CXX=g++ \
            -e PYTHON=/opt/python/cp312-cp312/bin/python3 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            quay.io/pypa/manylinux2014_x86_64@sha256:6f74cabeac2432570aa4bfdb29f7c1f30313d4d6654d764c44e574b6ffdd4ed5 bash -s <<'GLIBC217_COMPAT_SLOT'
          set -eu
          export PATH="$(dirname "$COMPAT_NODE"):$PATH"
          node config/scripts/orcad-distribution/prebuilds/build-orcad-prebuilds.mjs --slot=linux-x64-glibc217
          node config/scripts/orcad-distribution/prebuilds/build-orcad-prebuilds.mjs --require-slots linux-x64-glibc217
          env -u LD_LIBRARY_PATH node config/scripts/orcad-distribution/prebuilds/build-orcad-prebuilds.mjs --slot=linux-x64-glibc217 --smoke
          GLIBC217_COMPAT_SLOT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orcad-prebuild-glibc217
          path: out/orcad-prebuilds/
          if-no-files-found: error
          retention-days: 3

  musl:
    name: linux-${{ matrix.arch }}-musl
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-pnpm-verification
        id: pnpm-verification
        with:
          container-toolchain: 'true'
      # Multi-arch index digest as upstream pins it; re-resolve whenever NODE_RUNTIME_PIN moves.
      - name: Build and smoke the slot in Alpine
        env:
          VERIFICATION_CACHE_PATH: ${{ steps.pnpm-verification.outputs.path }}
        run: |
          touch "$VERIFICATION_CACHE_PATH"
          docker run --rm --init -i \
            -e ORCA_BACKGROUND_LAUNCH=1 \
            -v "$VERIFICATION_CACHE_PATH:/root/.cache/pnpm/lockfile-verified.jsonl" \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            node:24.22.1-alpine@sha256:6a1c190e17215d844926b0677f4bf87273ff7d5e54db06d3b5b5863ab0b09a3d sh -s <<'MUSL_SLOT'
          set -eu
          apk add --no-cache bash git libstdc++ python3 make g++
          git config --global --add safe.directory /work
          npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build:orcad-prebuilds
          pnpm build:orcad-prebuilds --require-slots "$(node config/scripts/orcad-distribution/prebuilds/build-orcad-prebuilds.mjs --print-slot)"
          pnpm build:orcad-prebuilds --smoke
          MUSL_SLOT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orcad-prebuild-musl-${{ matrix.arch }}
          path: out/orcad-prebuilds/
          if-no-files-found: error
          retention-days: 3

  # darwin and win32 slots, plus the Windows addons and CLI launchers windows-2022 builds for both arches.
  native:
    name: ${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ inputs.mac_runner }}
            slot: darwin-arm64
          - os: macos-15-intel
            slot: darwin-x64
          - os: windows-2022
            slot: win32-x64
          - os: windows-11-arm
            slot: win32-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: ${{ runner.os == 'Windows' && 'node' || 'none' }}
          cache-pnpm-store: 'false'
      - uses: ./.github/actions/prepare-orcad-prebuilds
        if: runner.os == 'Windows'
      - name: Build and gate the darwin slot
        if: runner.os == 'macOS'
        env:
          SLOT: ${{ matrix.slot }}
        run: bash .github/fork-build/build-orcad-slot.sh "$SLOT"
      - uses: ./.github/actions/prepare-windows-cli-launcher
        if: matrix.os == 'windows-2022'
        with:
          arches: x64 arm64
      - name: Build the Windows process-table and security addons
        if: matrix.os == 'windows-2022'
        shell: bash
        run: bash .github/fork-build/build-windows-orcad-addons.sh x64 arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orcad-prebuild-${{ matrix.slot }}
          path: out/orcad-prebuilds/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.os == 'windows-2022'
        with:
          name: orcad-windows-process-tree
          path: .build/windows-process-tree/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.os == 'windows-2022'
        with:
          name: orcad-windows-cli-launcher
          path: .build/windows-cli-launcher/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.os == 'windows-2022'
        with:
          name: orcad-windows-security
          path: .build/windows-security/*/windows-security.node
          if-no-files-found: error
          retention-days: 3

  template:
    name: merge
    needs: [glibc, glibc217, musl, native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: orcad-prebuild-*
          path: ${{ runner.temp }}/orcad-prebuild-lanes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: orcad-windows-process-tree
          path: .build/windows-process-tree
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: orcad-windows-cli-launcher
          path: .build/windows-cli-launcher
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: orcad-windows-security
          path: .build/windows-security
      - name: Merge the lanes and gate the full slot matrix
        run: |
          node config/scripts/orcad-distribution/prebuilds/merge-orcad-prebuilds.mjs "$RUNNER_TEMP"/orcad-prebuild-lanes/*
          pnpm build:orcad-prebuilds --require-slots
          pnpm build:orcad-prebuilds --require-slots linux-x64-glibc217
      - uses: ./.github/actions/build-mobile-web-bundle
      - run: pnpm build:orcad-template
      - name: Report the template size
        run: |
          {
            echo '### orcad template'
            echo '```'
            du -sh out/orcad-template out/orcad-template/targets/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: orcad-template
          path: out/orcad-template/
          # The per-target .server-target and .runtime-node markers are dotfiles.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
